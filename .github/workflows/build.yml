name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q VideoWallpaper.zip && chmod -R u+rwX VideoWallpaper
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
      - name: Build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bash VideoWallpaper/ci-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VideoWallpaper-APK
          path: VideoWallpaper/app/build/outputs/apk/*/*.apk
