name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q VideoWallpaper.zip && chmod -R u+rwX VideoWallpaper
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
      - name: Build
        working-directory: VideoWallpaper
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VideoWallpaper-APK
          path: VideoWallpaper/app/build/outputs/apk/debug/app-debug.apk
